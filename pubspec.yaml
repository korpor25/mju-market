name: maejo_market
description: "Maejo Market · แอปจัดการตลาดแม่โจ้ (Flutter + Firebase)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  shared_preferences: ^2.3.2

  # ---- Firebase (ใช้เมื่อตั้งค่าด้วย flutterfire configure แล้ว) ----
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # ---- อัปโหลดรูปขึ้น Cloudinary (ไม่ใช้ Firebase Storage เพราะต้องเปิด Blaze) ----
  http: ^1.2.2
  image_picker: ^1.1.2

  # ---- เปิดลิงก์เพิ่มเพื่อน LINE OA ----
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png

  fonts:
    - family: Kanit
      fonts:
        - asset: assets/fonts/Kanit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Kanit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Kanit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Kanit-Bold.ttf
          weight: 700
